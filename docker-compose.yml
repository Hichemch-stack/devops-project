version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: backend_db
      MYSQL_USER: adminspring
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile  # ton Dockerfile multi-stage
    container_name: app
    restart: unless-stopped
    environment:
      # Backend Spring Boot
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/backend_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: adminspring
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    depends_on:
      - mysql
    ports:
      - "8081:8080"   # backend
      - "4200:80"     # frontend Angular via Nginx

volumes:
  mysql_data:

