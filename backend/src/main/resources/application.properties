# Nom de l'application
spring.application.name=backend

# Configuration de la base MySQL (service Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/backend_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=adminspring
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Port et interface
server.port=8080
server.address=0.0.0.0  # expose sur toutes les interfaces pour Docker/VM

