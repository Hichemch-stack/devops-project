# Nom de l'application
spring.application.name=backend

# Configuration de la base MySQL (service Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/backend_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=adminspring
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Port et interface
server.port=8080
# expose sur toutes les interfaces pour Docker/VM
server.address=0.0.0.0

# Actuator exposure
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true

# Actuator base path (par défaut /actuator)
management.endpoints.web.base-path=/actuator

# Metrics
management.metrics.export.prometheus.enabled=true
